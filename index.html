<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusX - Productivity App</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <!-- data-theme="dark" -->
  <body>
    <main class="app">
      <header class="header">
        <h1>FocusX</h1>
        <label class="switch">
          <input type="checkbox" id="dark" />
          <span class="slider">
            <span id="ball">
              <i class="ri-sun-line" id="theme-ico"></i>
            </span>
          </span>
        </label>
      </header>
      <section id="dashboard">
        <div class="left">
          <div class="left-first">
            <h4>
              <span id="date">..</span> <span id="month">....</span> ,
              <span id="year">....</span>
            </h4>
            <h3><span id="day">...</span>, <span id="time">......</span></h3>
            <p id="place">New Delhi</p>
          </div>
          <div class="left-second">
            <h3><span id="temp">..</span> <span id="temp-unit">..</span></h3>
            <h3 id="weather-type"></h3>
          </div>
        </div>

        <div class="right">
          <div class="feature-cta" data-feature="todo-feature">
            <i class="ri-todo-fill"></i>
            <img
              src="/assets/media/todo.webp"
              alt="todo"
              id="todo-gif"
              class="gifs"
            />
            <p class="feature-label">Todo</p>
          </div>
          <div class="feature-cta" data-feature="planner-feature">
            <i class="ri-calendar-event-fill"></i>
            <img
              src="/assets/media/planner.webp"
              alt="todo"
              id="todo-gif"
              class="gifs"
            />
            <p class="feature-label">Planner</p>

          </div>
          <div class="feature-cta" data-feature="goals-feature">
            <i class="ri-target-fill"></i>
            <img
              src="./assets/media/goal.webp"
              alt="todo"
              id="todo-gif"
              class="gifs"
            />
            <p class="feature-label">Goals</p>

          </div>
          <div class="feature-cta" data-feature="pomodoro-feature">
            <i class="ri-timer-flash-line"></i>
            <img
              src="./assets/media/pomodoro.gif"
              alt="todo"
              id="todo-gif"
              class="gifs"
            />
            <p class="feature-label">Pomodoro</p>
          </div>
          <div class="feature-cta" data-feature="quote-feature">
            <i class="ri-fire-fill"></i>
            <img
              src="/assets/media/motivation.webp"
              alt="todo"
              id="todo-gif"
              class="gifs"
            />
            <p class="feature-label">motivation</p>
          </div>
        </div>
      </section>

      <section id="feature-view" class="hidden">
        <button id="back-btn"><i class="ri-arrow-left-line"></i></button>

        <!-- Todo Section -->
        <section id="todo-feature" class="feature hidden">
          <div class="board">
            <h2>TODO</h2>
            <form class="composer" id="composer">
              <input
                type="text"
                class="composer-input"
                id="taskInput"
                placeholder="What needs doing?"
                autocomplete="off"
              />
              <button type="submit" class="composer-add" aria-label="Add task">
                <i class="ri-add-fill"></i>
                Add
              </button>
            </form>

             <ul class="tasks" id="taskList">

            </ul>
          </div>
        </section>

        <!-- Planner -->
        <section id="planner-feature" class="feature hidden">Planner</section>

        <!-- Goals -->
        <section id="goals-feature" class="feature hidden">Goals</section>

        <!-- Pomodoro -->
        <section id="pomodoro-feature" class="feature hidden">Pomodoro</section>

        <!-- Quote -->
        <section id="quote-feature" class="feature hidden">Quote</section>

    </main>

    <script src="script.js"></script>
  </body>
